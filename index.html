<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phoenix Golf Addicts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F0EA; --surface:#FBFAF6; --surface2:#E7E5DB; --raise:#FFFFFF;
  --line:#D6D3C6; --line-soft:#E3E0D5;
  --ink:#17211C; --ink2:#4C5853; --ink3:#818B85;
  --accent:#2F6B48; --accent-ink:#FFFFFF; --accent-soft:#DEE9E0; --accent-line:#B6CDBE;
  --sun:#A9680E; --sun-soft:#F6E6C8; --sun-line:#E0C48C;
  --clay:#9E3E28; --clay-soft:#F3DDD6;
  --shadow:0 1px 2px rgba(23,33,28,.05), 0 10px 26px -16px rgba(23,33,28,.30);
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#171F1B; --surface2:#1E2822; --raise:#222D27;
    --line:#2D3833; --line-soft:#25302B;
    --ink:#EAEEEA; --ink2:#A7B2AC; --ink3:#77837C;
    --accent:#6FB287; --accent-ink:#0F1613; --accent-soft:#1C3327; --accent-line:#2F5741;
    --sun:#E0A247; --sun-soft:#37280F; --sun-line:#5C441B;
    --clay:#DB7A63; --clay-soft:#3A1E17;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -18px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#171F1B; --surface2:#1E2822; --raise:#222D27;
  --line:#2D3833; --line-soft:#25302B;
  --ink:#EAEEEA; --ink2:#A7B2AC; --ink3:#77837C;
  --accent:#6FB287; --accent-ink:#0F1613; --accent-soft:#1C3327; --accent-line:#2F5741;
  --sun:#E0A247; --sun-soft:#37280F; --sun-line:#5C441B;
  --clay:#DB7A63; --clay-soft:#3A1E17;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -18px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
@media (min-width:760px){ body{padding-bottom:2rem} }
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:940px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:940px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.mark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.16rem;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.mark u{text-decoration:none;color:var(--accent);border-bottom:2.5px solid var(--accent);padding-bottom:1px}
.mark-sub{font-size:.68rem;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-top:3px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.leadchip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.leadchip .lbl{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.leadchip .val{font-size:.9rem;font-weight:700}
.leadchip .pts{color:var(--accent)}
.savedot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transition:background .2s}
.savedot[data-s="dirty"]{background:var(--sun)}
.savedot[data-s="saving"]{background:var(--sun);animation:pulse 1s infinite}
.savedot[data-s="ok"]{background:var(--accent)}
.savedot[data-s="err"]{background:var(--clay)}
@keyframes pulse{50%{opacity:.25}}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--surface2);border-top:1px solid var(--line);
  position:fixed;left:0;right:0;bottom:0;z-index:45;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.tabs button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{background:var(--raise);color:var(--accent);box-shadow:var(--shadow)}
@media (min-width:760px){
  .tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);
    background:var(--bg);max-width:940px;margin:0 auto;padding:0 14px;gap:4px}
  .tabs button{flex:0 0 auto;flex-direction:row;gap:7px;padding:11px 14px;border-radius:0;
    border-bottom:2.5px solid transparent;font-size:.72rem}
  .tabs button[aria-selected="true"]{background:transparent;box-shadow:none;border-bottom-color:var(--accent)}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sect{margin:18px 0}
.sect-h{display:flex;align-items:baseline;gap:9px;margin:0 0 9px}
.sect-h h2{font-size:.79rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.sect-h .rule{flex:1;height:1px;background:var(--line)}
.muted{color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:var(--surface2)}
.pill.live{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.pill.done{background:var(--sun-soft);border-color:var(--sun-line);color:var(--sun)}
.stack{display:flex;flex-direction:column;gap:10px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hide{display:none!important}

/* standings */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.hero-rank{font-family:"Bricolage Grotesque",sans-serif;font-size:2.5rem;font-weight:800;color:var(--accent);
  line-height:.85;letter-spacing:-.05em;padding-left:6px}
.hero-body{flex:1;min-width:0}
.hero-name{font-family:"Bricolage Grotesque",sans-serif;font-size:1.32rem;font-weight:700;letter-spacing:-.02em;
  line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-meta{font-size:.78rem;color:var(--ink3);margin-top:2px}
.hero-pts{text-align:right;line-height:1}
.hero-pts b{font-family:"IBM Plex Mono",monospace;font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hero-pts span{display:block;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-top:4px}
table.board{width:100%;border-collapse:collapse;font-size:.85rem}
table.board th{font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700;
  padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.board th.l,table.board td.l{text-align:left}
table.board td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line-soft);white-space:nowrap}
table.board tr:last-child td{border-bottom:0}
table.board .pos{font-family:"IBM Plex Mono",monospace;color:var(--ink3);width:1.6rem;font-size:.78rem}
table.board .nm{font-weight:600;max-width:9.5rem;overflow:hidden;text-overflow:ellipsis}
table.board .rp{font-family:"IBM Plex Mono",monospace;color:var(--ink2);font-size:.8rem}
table.board .rp.zero{color:var(--ink3);opacity:.5}
table.board .tot{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.98rem}
.sticky-l{position:sticky;left:0;background:var(--surface);z-index:1}
.sticky-r{position:sticky;right:0;background:var(--surface);z-index:1;box-shadow:-9px 0 9px -9px rgba(0,0,0,.20)}
@media (max-width:559px){ .hide-sm{display:none} }
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.money div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px}
.money b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.24rem;font-weight:600;color:var(--sun)}
.money span{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}

/* rounds */
.daybar{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.daybar b{font-family:"Bricolage Grotesque",sans-serif;font-size:.95rem;font-weight:700}
.daybar span{font-size:.72rem;color:var(--ink3)}
.daybar .rule{flex:1;height:1px;background:var(--line)}
.rnd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
.rnd-h{padding:13px 14px;display:flex;align-items:center;gap:11px}
.rnd>summary{list-style:none;cursor:pointer}
.rnd>summary::-webkit-details-marker{display:none}
.rnd>summary::after{content:"";width:7px;height:7px;flex:none;margin-left:2px;
  border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .18s}
.rnd[open]>summary::after{transform:rotate(-135deg)}
.rnd[open]>summary.rnd-h{border-bottom:1px solid var(--line-soft)}
.rnd>summary:hover{background:var(--surface2)}
.rnd-n{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.9rem;border:1px solid var(--accent-line)}
.rnd-t{flex:1;min-width:0}
.rnd-t b{display:block;font-size:.97rem;font-weight:700;line-height:1.25}
.rnd-t span{font-size:.73rem;color:var(--ink3)}

/* match block + points entry */
.grpbar{display:flex;align-items:center;gap:8px;padding:11px 13px 1px;
  font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.grpbar b{color:var(--ink2)}
.grpbar span{font-family:"IBM Plex Mono",monospace;letter-spacing:0;text-transform:none;font-size:.68rem}
.grpbar i{flex:1;height:1px;background:var(--line-soft)}
.mblk{margin:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--raise);overflow:hidden}
.mblk-h{display:grid;grid-template-columns:1fr 3.5rem 3.5rem;gap:8px;align-items:center;
  padding:6px 10px;background:var(--surface2);border-bottom:1px solid var(--line)}
.mblk-h .ttl{display:flex;align-items:center;gap:7px;min-width:0;
  font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.mblk-h .lbl{font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:center}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;padding:0 10px}
.vs i{height:1px;background:var(--line-soft);display:block}
.vs b{font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.mblk-h em{font-style:normal;font-size:.66rem;font-weight:700;color:var(--sun);background:var(--sun-soft);
  border:1px solid var(--sun-line);border-radius:99px;padding:1px 8px;margin-left:auto}
.pent{display:grid;grid-template-columns:1fr 3.5rem 3.5rem;gap:8px;align-items:center;padding:7px 10px}
.pent .who{min-width:0}
.pent .who b{display:block;font-size:.88rem;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pent .who span{font-size:.68rem;color:var(--ink3);font-family:"IBM Plex Mono",monospace}
.pent .who b.w{color:var(--accent)}
.pent .win{font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:99px;padding:2px 7px}
.pin{width:100%;height:2.3rem;flex:none;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--raise);color:var(--ink);text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:1rem;font-weight:600;padding:0}
.pin:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
.pin.over{border-color:var(--clay);color:var(--clay)}
.ctp-line{padding:9px 14px;background:var(--sun-soft);border-top:1px solid var(--sun-line);
  font-size:.76rem;display:flex;align-items:center;gap:7px;color:var(--sun);font-weight:600}

/* forms */
label.f{display:block;font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:4px}
input.t,select.t{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--raise);color:var(--ink);
  padding:8px 9px;font-size:.87rem;font-family:inherit}
input.t.num,select.t.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
input.t:focus,select.t:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none}
select.t{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.prow{display:grid;grid-template-columns:1.6rem 1fr 4.6rem;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-soft)}
.prow:last-child{border-bottom:0}
.prow .idx{font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--ink3);text-align:center}
.prow.n2{grid-template-columns:1.6rem 1fr}
.prow.dupe input:first-of-type{border-color:var(--clay)}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.acc>summary{padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;list-style:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .18s}
.acc[open]>summary::after{transform:rotate(-135deg)}
.acc[open]>summary{border-bottom:1px solid var(--line-soft)}
.acc-body{padding:12px 14px;display:flex;flex-direction:column;gap:13px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.mset{display:grid;grid-template-columns:1fr 1.7rem 1fr;gap:6px;align-items:center;margin-bottom:8px}
.mset select{min-width:0}
.mset .v{text-align:center;font-size:.62rem;color:var(--ink3);font-weight:700;letter-spacing:.06em}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r-sm);padding:9px 14px;
  font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btn.d{color:var(--clay);border-color:var(--clay)}
.note{background:var(--sun-soft);border:1px solid var(--sun-line);border-radius:var(--r-sm);padding:10px 12px;font-size:.79rem;color:var(--ink2)}
.note b{color:var(--sun)}
.warn{background:var(--clay-soft);border:1px solid var(--clay);border-radius:var(--r-sm);padding:10px 12px;font-size:.79rem;color:var(--ink2)}
.warn b{color:var(--clay)}
.ro{background:var(--clay-soft);border:1px solid var(--clay);border-radius:var(--r-sm);padding:9px 12px;font-size:.79rem;color:var(--ink2);margin-top:10px}

/* rules */
.doc{font-size:.89rem;color:var(--ink2);max-width:62ch}
.doc h3{font-family:"Bricolage Grotesque",sans-serif;font-size:.96rem;color:var(--ink);margin:0 0 6px}
.doc p{margin:0 0 9px}
.doc ul{margin:0 0 9px;padding-left:1.1rem}
.doc li{margin-bottom:5px}
.doc strong{color:var(--ink);font-weight:700}
.doc .hz{border-left:3px solid var(--sun);padding-left:11px;margin-bottom:11px}
.doc .hz.red{border-left-color:var(--clay)}
.ptbl{width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:10px}
.ptbl td{padding:7px 4px;border-bottom:1px solid var(--line-soft)}
.ptbl td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap}
.ptbl tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div>
    <div class="mark"><u>P</u>hoenix <u>G</u>olf <u>A</u>ddicts</div>
    <div class="mark-sub">2026 Tournament &middot; Aug 26&ndash;29</div>
  </div>
  <div class="top-right">
    <div class="leadchip" id="leadchip"></div>
    <div class="savedot" id="savedot" title="Saved"></div>
  </div>
</div></div>

<script>
(function(){
"use strict";

var ST=null, BASE=null, PEND=new Map(), CAP=null, READONLY=false, NOCAP=false, FILES=true, saveTimer=null;
var UI={tab:"rounds"};

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function has(v){ return v!==null && v!==undefined && v!==""; }
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function getPath(o,p){ var c=o; for(var i=0;i<p.length;i++){ if(c==null) return undefined; c=c[p[i]]; } return c; }
function deepSet(o,p,v){ var c=o; for(var i=0;i<p.length-1;i++){ if(c[p[i]]==null) c[p[i]]={}; c=c[p[i]]; } c[p[p.length-1]]=v; }
function readEmbedded(){ try{ return JSON.parse(document.getElementById("pga-state").textContent); }catch(e){ return null; } }
function loadPend(){ try{ var r=sessionStorage.getItem("pga.pending"); if(r) JSON.parse(r).forEach(function(op){ PEND.set(op.path.join("|"),op); }); }catch(e){} }
function savePend(){ try{ sessionStorage.setItem("pga.pending", JSON.stringify(Array.from(PEND.values()))); }catch(e){} }
function loadUI(){ try{ var r=sessionStorage.getItem("pga.ui"); if(r) UI=JSON.parse(r); }catch(e){} }
function saveUI(){ try{ sessionStorage.setItem("pga.ui", JSON.stringify(UI)); }catch(e){} }

/* ============ lookups + tallies ============ */
function player(id){ for(var i=0;i<ST.players.length;i++) if(ST.players[i].id===id) return ST.players[i]; return null; }
function pname(id){ var p=player(id); return p&&p.name?p.name:"\u2014"; }
function findRound(id){ for(var i=0;i<ST.rounds.length;i++) if(ST.rounds[i].id===id) return ST.rounds[i]; return null; }
function rIndex(id){ for(var i=0;i<ST.rounds.length;i++) if(ST.rounds[i].id===id) return i; return -1; }

function val(r,field,pid){ return (r[field] && has(r[field][pid])) ? num(r[field][pid]) : null; }
function pts(r,pid){ var v=val(r,"points",pid); return v===null?0:v; }
function anyEntered(r){
  for(var i=0;i<ST.players.length;i++){
    var id=ST.players[i].id;
    if(val(r,"points",id)!==null || val(r,"gross",id)!==null) return true;
  }
  return false;
}
function allEntered(r){
  for(var i=0;i<ST.players.length;i++) if(val(r,"points",ST.players[i].id)===null) return false;
  return true;
}
/* match outcome read back from the points that were entered */
function matchResult(r,m){
  var a=val(r,"points",m.a), b=val(r,"points",m.b);
  if(a===null||b===null) return null;
  return a>b ? "a" : (b>a ? "b" : "tie");
}
function standings(){
  var rows=ST.players.map(function(p){
    var per=ST.rounds.map(function(r){ return pts(r,p.id); });
    var gr=0, gn=0;
    ST.rounds.forEach(function(r){ var g=val(r,"gross",p.id); if(g!==null){ gr+=g; gn++; } });
    return {p:p, per:per, tot:per.reduce(function(a,b){return a+b;},0), gross:gr, grossRounds:gn};
  });
  rows.sort(function(x,y){ return y.tot-x.tot || String(x.p.name).localeCompare(String(y.p.name)); });
  var pos=0, prev=null;
  rows.forEach(function(row,i){ if(prev===null||row.tot!==prev){ pos=i+1; prev=row.tot; } row.pos=pos; });
  return rows;
}
function fmtPts(n){ return (Math.round(n*100)/100).toString(); }

/* ============ persistence ============ */
function dot(s){ var d=document.getElementById("savedot"); if(d) d.setAttribute("data-s",s); }
function setPath(path,v){
  deepSet(ST,path,v);
  PEND.set(path.join("|"),{path:path,v:v});
  savePend(); dot("dirty"); scheduleSave();
}
function scheduleSave(){ if(READONLY) return; clearTimeout(saveTimer); saveTimer=setTimeout(doSave,2200); }
function buildNext(){
  var next=clone(BASE);
  PEND.forEach(function(op){ deepSet(next,op.path,op.v); });
  next.rev=(num(BASE.rev)||0)+1;
  return next;
}
function stateJSON(s){ return JSON.stringify(s).replace(/</g,"\\u003c"); }
function fullDoc(s){
  var b64=document.getElementById("pga-shell").textContent.trim();
  var shell=atob(b64);
  var MK_S="__"+"SHELL_B64"+"__", MK_J="__"+"STATE_JSON"+"__";
  return shell.split(MK_S).join(b64).split(MK_J).join(stateJSON(s));
}
function goReadonly(){
  READONLY=true; dot("err");
  document.querySelectorAll("input,select,button.btn").forEach(function(el){ el.disabled=true; });
  render();
}
function doSave(){
  if(READONLY||!CAP||PEND.size===0) return;
  var next=buildNext();
  dot("saving");
  var attempt = FILES
    ? CAP.publish({"data/state.json": {content: stateJSON(next), contentType:"application/json"}})
    : CAP.publish(fullDoc(next));
  attempt.then(function(){ BASE=next; PEND.clear(); savePend(); dot("ok"); })
  .catch(function(err){
    var code=(err&&err.code)||"upstream_error";
    if((code==="capability_disabled"||code==="capability_removed"||code==="transform_error") && FILES){
      FILES=false; dot("dirty"); doSave(); return;
    }
    if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="consent_required"){ goReadonly(); return; }
    if(code==="conflict"){ dot("dirty"); return; }
    if(code==="rate_limited"){ dot("dirty"); clearTimeout(saveTimer); saveTimer=setTimeout(doSave,6000); return; }
    dot("err"); clearTimeout(saveTimer); saveTimer=setTimeout(doSave,4000);
  });
}

/* ============ chrome ============ */
var ICON={
  standings:'<path d="M4 19V9M10 19V4M16 19v-7M2 21h20"/>',
  rounds:'<path d="M6 21V3l11 4-11 4"/><circle cx="6" cy="21" r="0.6"/>',
  rules:'<path d="M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h7M8 11h7"/>',
  setup:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>'
};
var TABS=[["standings","Standings"],["rounds","Rounds"],["rules","Rules"],["setup","Setup"]];
function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(UI.tab===t[0])+'">'+
      '<svg viewBox="0 0 24 24">'+ICON[t[0]]+'</svg><span>'+t[1]+'</span></button>';
  }).join("");
}
function renderLead(){
  var rows=standings(), el=document.getElementById("leadchip");
  if(!rows.length || rows[0].tot===0){ el.innerHTML='<span class="lbl">Round 1</span><span class="val">Aug 26</span>'; return; }
  el.innerHTML='<span class="lbl">Leader</span><span class="val">'+esc(rows[0].p.name)+
    ' <span class="pts mono">'+fmtPts(rows[0].tot)+'</span></span>';
}

/* ============ standings ============ */
function viewStandings(){
  var rows=standings(), lead=rows[0], gap=rows.length>1?lead.tot-rows[1].tot:0;
  var done=ST.rounds.filter(anyEntered).length;
  var h='<div class="sect">';
  if(lead.tot>0){
    h+='<div class="hero"><div class="hero-rank">1</div><div class="hero-body">'+
      '<div class="hero-name">'+esc(lead.p.name)+'</div><div class="hero-meta">'+
      (gap>0?"Leads by "+fmtPts(gap)+" after "+done+" of 6":"Tied at the top after "+done+" of 6")+
      '</div></div><div class="hero-pts"><b class="mono">'+fmtPts(lead.tot)+'</b><span>Points</span></div></div>';
  }else{
    h+='<div class="hero"><div class="hero-body"><div class="hero-name">No points in yet</div>'+
      '<div class="hero-meta">Standings fill in as rounds are entered.</div></div></div>';
  }
  h+='</div>';
  h+='<div class="sect"><div class="sect-h"><h2>Overall</h2><div class="rule"></div>'+
     '<span class="muted" style="font-size:.7rem">12.5 max / round</span></div>'+
     '<div class="card scroll-x"><table class="board"><thead><tr>'+
     '<th class="sticky-l l" colspan="2">Player</th>';
  for(var i=1;i<=6;i++) h+='<th>R'+i+'</th>';
  h+='<th class="hide-sm">Gross</th><th class="sticky-r">Total</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td class="pos sticky-l mono">'+r.pos+'</td><td class="nm l">'+esc(r.p.name)+'</td>';
    r.per.forEach(function(v,i){
      var g=val(ST.rounds[i],"points",r.p.id);
      h+='<td class="rp'+(g===null?" zero":"")+'">'+(g===null?"\u2014":fmtPts(v))+'</td>';
    });
    h+='<td class="rp hide-sm">'+(r.grossRounds?r.gross:"\u2014")+'</td>'+
       '<td class="tot sticky-r">'+fmtPts(r.tot)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  var ctpWins={};
  ST.rounds.forEach(function(r){ if(has(r.ctp)) ctpWins[r.ctp]=(ctpWins[r.ctp]||0)+1; });
  var list=Object.keys(ctpWins).map(function(k){ return esc(pname(k))+" \u00d7"+ctpWins[k]; }).join(", ");
  h+='<div class="sect"><div class="sect-h"><h2>Purse</h2><div class="rule"></div></div><div class="money">'+
     '<div><b>$120</b><span>First place</span></div><div><b>$60</b><span>Second place</span></div>'+
     '<div><b>$10</b><span>CTP &times; 6 rounds</span></div></div>'+
     (list?'<div class="note" style="margin-top:9px">Closest to the pin: <b>'+list+'</b></div>':'')+'</div>';
  return h;
}

/* ============ rounds \u2014 the only place scores go in ============ */
/* Which rounds start expanded: what the scorer last opened, else the first
   round that still needs entries. */
function firstOpen(){
  for(var i=0;i<ST.rounds.length;i++) if(!allEntered(ST.rounds[i])) return ST.rounds[i].id;
  return ST.rounds.length ? ST.rounds[ST.rounds.length-1].id : null;
}
function isOpen(r){
  if(UI.open && UI.open.length) return UI.open.indexOf(r.id)>=0;
  return r.id===firstOpen();
}
function viewRounds(){
  var h='', lastDay=null;
  ST.rounds.forEach(function(r){
    if(r.day!==lastDay){
      lastDay=r.day;
      h+='<div class="daybar"><b>'+esc(r.day)+'</b><span>'+esc(r.date)+'</span><div class="rule"></div></div>';
    }
    var full=allEntered(r), started=anyEntered(r);
    h+='<details class="rnd" data-rnd="'+r.id+'"'+(isOpen(r)?" open":"")+'><summary class="rnd-h">'+
      '<div class="rnd-n mono">'+r.n+'</div><div class="rnd-t"><b>'+esc(r.course)+'</b>'+
      '<span>'+esc(r.club)+' &middot; '+esc(r.times.join(" / "))+'</span></div>'+
      (full?'<span class="pill done">Final</span>':started?'<span class="pill live">In progress</span>':'<span class="pill">Upcoming</span>')+
      '</summary>';
    r.matches.forEach(function(m,mi){
      var res=matchResult(r,m);
      var badge = res==="tie" ? "Tied" : res ? esc(pname(res==="a"?m.a:m.b).split(" ")[0])+" won" : "";
      if(mi===0||mi===2){
        var gi=mi===0?0:1;
        h+='<div class="grpbar"><b>Group '+(gi+1)+'</b>'+
           (r.times[gi]?'<span>'+esc(r.times[gi])+'</span>':'')+'<i></i></div>';
      }
      h+='<div class="mblk"><div class="mblk-h"><span class="ttl">Match '+(mi+1)+
        (badge?'<em>'+badge+'</em>':'')+'</span>'+
        (mi===0?'<span class="lbl">Gross</span><span class="lbl">Pts</span>':'<span></span><span></span>')+
        '</div>';
      [m.a,m.b].forEach(function(pid,side){
        if(side===1) h+='<div class="vs"><i></i><b>vs</b><i></i></div>';
        var g=val(r,"gross",pid), p=val(r,"points",pid);
        var winner = res && res!=="tie" && ((res==="a"&&side===0)||(res==="b"&&side===1));
        h+='<div class="pent"><div class="who"><b'+(winner?' class="w"':'')+'>'+esc(pname(pid))+'</b></div>'+
          '<input class="pin mono" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="'+(g===null?"":g)+
            '" data-g="'+r.id+'|'+pid+'" aria-label="'+esc(pname(pid))+' gross score, round '+r.n+'">'+
          '<input class="pin mono'+(p!==null&&p>12.5?" over":"")+'" inputmode="decimal" maxlength="5" value="'+(p===null?"":p)+
            '" data-p="'+r.id+'|'+pid+'" aria-label="'+esc(pname(pid))+' points, round '+r.n+'">'+
          '</div>';
      });
      h+='</div>';
    });
    h+='<div class="ctp-line"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"><path d="M6 21V3l11 4-11 4"/></svg>'+
      'CTP &middot; Hole '+r.ctpHole+
      '<select class="t" data-ctp="'+r.id+'" style="margin-left:auto;width:auto;max-width:11rem;font-size:.76rem;padding:4px 24px 4px 8px">'+
      '<option value="">Not won yet</option>'+
      ST.players.map(function(p){ return '<option value="'+p.id+'"'+(r.ctp===p.id?" selected":"")+'>'+esc(p.name)+'</option>'; }).join("")+
      '</select></div></details>';
  });
  return h;
}

/* ============ setup ============ */
function pOptions(sel){
  return ST.players.map(function(p){ return '<option value="'+p.id+'"'+(sel===p.id?" selected":"")+'>'+esc(p.name)+'</option>'; }).join("");
}
function dupeNames(){
  var seen={}, dupes={};
  ST.players.forEach(function(p){
    var k=String(p.name||"").trim().toLowerCase();
    if(!k) return;
    if(seen[k]) dupes[k]=true; else seen[k]=true;
  });
  return dupes;
}
/* Every player should appear in exactly one match per round. Catches a
   half-finished edit that would otherwise quietly mis-score the round. */
function badMatchups(r){
  var seen={}, i;
  r.matches.forEach(function(m){
    seen[m.a]=(seen[m.a]||0)+1;
    seen[m.b]=(seen[m.b]||0)+1;
  });
  var twice=[], missing=[];
  for(i=0;i<ST.players.length;i++){
    var id=ST.players[i].id, n=seen[id]||0;
    if(n>1) twice.push(esc(pname(id)));
    else if(n===0) missing.push(esc(pname(id)));
  }
  if(!twice.length && !missing.length) return "";
  var out="";
  if(twice.length) out+="<b>"+twice.join(", ")+"</b> "+(twice.length>1?"are":"is")+" in more than one match. ";
  if(missing.length) out+="<b>"+missing.join(", ")+"</b> "+(missing.length>1?"are":"is")+" not in a match. ";
  return out+"Each player should appear exactly once.";
}
function viewSetup(){
  var dupes=dupeNames(), anyDupe=Object.keys(dupes).length>0;
  var h='<div class="sect"><div class="sect-h"><h2>Players</h2><div class="rule"></div></div><div class="card">';
  ST.players.forEach(function(p,i){
    var isDupe=dupes[String(p.name||"").trim().toLowerCase()];
    h+='<div class="prow n2'+(isDupe?" dupe":"")+'"><span class="idx mono">'+(i+1)+'</span>'+
      '<input class="t" value="'+esc(p.name)+'" placeholder="Player '+(i+1)+'" data-pn="'+i+'"></div>';
  });
  h+='</div>';
  if(anyDupe) h+='<div class="warn" style="margin-top:9px"><b>Two players share a name.</b> '+
    'Standings track each slot separately, so give them different names before entering points.</div>';
  h+='</div>';

  h+='<div class="sect"><div class="sect-h"><h2>Matchups</h2><div class="rule"></div></div><div class="stack">';
  ST.rounds.forEach(function(r){
    h+='<details class="acc"><summary><span class="rnd-n mono" style="width:26px;height:26px;font-size:.78rem">'+r.n+
      '</span>'+esc(r.course)+'</summary><div class="acc-body">';
    h+='<div>';
    r.matches.forEach(function(m,mi){
      h+='<div class="mset"><select class="t" data-mp="'+r.id+'|'+mi+'|a">'+pOptions(m.a)+'</select>'+
        '<span class="v">vs</span><select class="t" data-mp="'+r.id+'|'+mi+'|b">'+pOptions(m.b)+'</select></div>';
    });
    h+='</div>';
    var bad=badMatchups(r);
    if(bad) h+='<div class="warn">'+bad+'</div>';
    h+='<div class="g2"><div><label class="f">CTP hole</label>'+
      '<input class="t num" inputmode="numeric" maxlength="2" value="'+esc(r.ctpHole)+'" data-ct="'+r.id+'"></div></div>';
    h+='</div></details>';
  });
  h+='</div></div>';
  h+='<div class="sect"><button class="btn d" data-reset="1">Clear all scores</button></div>';
  return h;
}

/* ============ rules ============ */
function viewRules(){
  var ctp=ST.rounds.map(function(r){
    return '<tr><td>R'+r.n+' &middot; '+esc(r.course)+'</td><td>Hole '+r.ctpHole+'</td></tr>'; }).join("");
  return '<div class="sect"><div class="sect-h"><h2>The format</h2><div class="rule"></div></div><div class="doc">'+
   '<p><strong>Net Match Play</strong> each round. Course handicap is calculated for each player from Player Handicap, '+
   'Course and Slope Rating and Par for the 18 holes. The higher course handicap player receives a pop on each of the '+
   'hardest handicap holes, up to the total course handicap differential. Total points are tallied at the end of each day.</p>'+
   '<table class="ptbl"><tbody>'+
   '<tr><td>Each hole won</td><td>1</td></tr>'+
   '<tr><td>Hole halved or lost</td><td>0</td></tr>'+
   '<tr><td>Winner of the match</td><td>+0.5</td></tr>'+
   '<tr><td>Match tied &mdash; each player</td><td>+0.25</td></tr>'+
   '<tr><td>Maximum per round</td><td>12.5</td></tr>'+
   '</tbody></table></div></div>'+
   '<div class="sect"><div class="sect-h"><h2>A few reminders</h2><div class="rule"></div></div><div class="doc">'+
   '<p><strong>1. Breakfast ball.</strong> One is allowed, on the first hole of each round only.</p>'+
   '<p><strong>2. Penalty areas and OB.</strong> The courses will not be marked for tournament play, so treat penalty areas '+
   'as a red staked penalty area unless clearly marked as a yellow or white penalty area. If you go OB, we encourage the '+
   'local OB rule: drop your ball in the fairway where the ball went OB and assess a 2 stroke penalty. Example &mdash; if your '+
   'tee shot goes OB, drop in the fairway where your ball went OB. You will be hitting 4 on your next shot.</p>'+
   '<p><strong>3. Pace of play.</strong> Please play to a 4&frac14; hour or better pace.</p></div></div>'+
   '<div class="sect"><div class="sect-h"><h2>Red vs yellow</h2><div class="rule"></div></div><div class="doc">'+
   '<div class="hz"><h3>Yellow &mdash; standard penalty area</h3><ul>'+
   '<li><strong>Stroke and distance:</strong> go back and replay the shot from where you last hit.</li>'+
   '<li><strong>Back on the line:</strong> go straight back from where the ball crossed the hazard edge, keeping that point '+
   'aligned with the hole, as far back as you want.</li></ul></div>'+
   '<div class="hz red"><h3>Red &mdash; lateral penalty area</h3><ul>'+
   '<li>Both options above, plus&hellip;</li>'+
   '<li><strong>Lateral relief:</strong> drop within two club-lengths of the exact spot where the ball last crossed the edge '+
   'of the hazard, no closer to the hole.</li></ul></div></div></div>'+
   '<div class="sect"><div class="sect-h"><h2>Prizes</h2><div class="rule"></div></div><div class="doc">'+
   '<table class="ptbl"><tbody><tr><td>First place</td><td>$120</td></tr>'+
   '<tr><td>Second place</td><td>$60</td></tr>'+
   '<tr><td>Closest to the pin, each round</td><td>$10</td></tr></tbody></table>'+
   '<table class="ptbl"><tbody>'+ctp+'</tbody></table></div></div>';
}

/* ============ render ============ */
function render(){
  renderTabs(); renderLead();
  var v=document.getElementById("view"), h="";
  if(READONLY) h+='<div class="ro">This view is read-only &mdash; anything you type here will not be saved for the group.</div>';
  else if(NOCAP) h+='<div class="ro">Live saving is off in this preview. Open the shared link to enter scores.</div>';
  if(UI.tab==="standings") h+=viewStandings();
  else if(UI.tab==="rounds") h+=viewRounds();
  else if(UI.tab==="rules") h+=viewRules();
  else h+=viewSetup();
  v.innerHTML=h;
  if(READONLY) v.querySelectorAll("input,select").forEach(function(el){ el.disabled=true; });
}

/* ============ events ============ */
document.addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-tab],[data-reset]"):null;
  if(!t) return;
  if(t.hasAttribute("data-tab")){ UI.tab=t.getAttribute("data-tab"); saveUI(); render(); window.scrollTo(0,0); }
  else if(t.hasAttribute("data-reset")){
    if(!window.confirm("Clear every gross score and point total? This cannot be undone.")) return;
    ST.rounds.forEach(function(r,i){
      setPath(["rounds",i,"gross"],{});
      setPath(["rounds",i,"points"],{});
      setPath(["rounds",i,"ctp"],"");
    });
    render();
  }
});
document.addEventListener("input",function(ev){
  var el=ev.target, a;
  if(el.hasAttribute("data-g")){
    a=el.getAttribute("data-g").split("|");
    var g=el.value.replace(/[^0-9]/g,"").slice(0,3);
    if(el.value!==g) el.value=g;
    setPath(["rounds",rIndex(a[0]),"gross",a[1]], g===""?null:parseInt(g,10));
    renderLead(); return;
  }
  if(el.hasAttribute("data-p")){
    a=el.getAttribute("data-p").split("|");
    var p=el.value.replace(/[^0-9.]/g,"");
    var bits=p.split("."); if(bits.length>2) p=bits[0]+"."+bits.slice(1).join("");
    p=p.slice(0,5);
    if(el.value!==p) el.value=p;
    var n = (p===""||p===".") ? null : parseFloat(p);
    setPath(["rounds",rIndex(a[0]),"points",a[1]], n);
    el.classList.toggle("over", n!==null && n>12.5);
    refreshRoundBadges(a[0]);
    renderLead(); return;
  }
  if(el.hasAttribute("data-pn")){ setPath(["players",parseInt(el.getAttribute("data-pn"),10),"name"], el.value); renderLead(); return; }
  if(el.hasAttribute("data-ct")){ setPath(["rounds",rIndex(el.getAttribute("data-ct")),"ctpHole"], el.value.replace(/[^0-9]/g,"").slice(0,2)); return; }
});
document.addEventListener("toggle",function(ev){
  var d=ev.target;
  if(!d.classList||!d.classList.contains("rnd")) return;
  var open=[];
  document.querySelectorAll("details.rnd[open]").forEach(function(x){ open.push(x.getAttribute("data-rnd")); });
  UI.open=open; saveUI();
},true);
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.hasAttribute("data-ctp")){ setPath(["rounds",rIndex(el.getAttribute("data-ctp")),"ctp"], el.value); return; }
  if(el.hasAttribute("data-mp")){
    var a=el.getAttribute("data-mp").split("|");
    setPath(["rounds",rIndex(a[0]),"matches",parseInt(a[1],10),a[2]], el.value);
    refreshNames(); return;
  }
  if(el.hasAttribute("data-pn")) refreshNames();
});
/* Update the won/tied badges in place. A full re-render here would pull the
   input out from under the person still typing in it. */
function refreshRoundBadges(rid){
  if(UI.tab!=="rounds") return;
  var r=findRound(rid); if(!r) return;
  var card=document.querySelector('[data-rnd="'+rid+'"]'); if(!card) return;
  var blocks=card.querySelectorAll(".mblk");
  r.matches.forEach(function(m,mi){
    var blk=blocks[mi]; if(!blk) return;
    var res=matchResult(r,m), ttl=blk.querySelector(".mblk-h .ttl"), old=ttl.querySelector("em");
    if(old) old.remove();
    if(res){
      var em=document.createElement("em");
      em.textContent = res==="tie" ? "Tied" : pname(res==="a"?m.a:m.b).split(" ")[0]+" won";
      ttl.appendChild(em);
    }
    var names=blk.querySelectorAll(".who b");
    if(names[0]) names[0].className = (res==="a")?"w":"";
    if(names[1]) names[1].className = (res==="b")?"w":"";
  });
  var pill=card.querySelector(".rnd-h .pill");
  if(pill){
    if(allEntered(r)){ pill.className="pill done"; pill.textContent="Final"; }
    else if(anyEntered(r)){ pill.className="pill live"; pill.textContent="In progress"; }
    else { pill.className="pill"; pill.textContent="Upcoming"; }
  }
}
function refreshNames(){
  renderLead();
  document.querySelectorAll("select[data-mp],select[data-ctp]").forEach(function(sel){
    Array.prototype.forEach.call(sel.options,function(o){
      if(!o.value) return;
      var pl=player(o.value); if(pl) o.textContent=pl.name||"Player";
    });
  });
  if(UI.tab==="rounds") render();
}

/* ============ boot ============ */
function ensureShape(s){
  if(!s||!s.players||!s.rounds) return;
  s.rounds.forEach(function(r){
    if(!r.gross) r.gross={};
    if(!r.points) r.points={};
    if(!r.times) r.times = r.tees || [];
  });
}
function applyPend(){ PEND.forEach(function(op){ deepSet(ST,op.path,op.v); }); }
function reconcile(){
  var stale=[];
  PEND.forEach(function(op,k){ if(JSON.stringify(getPath(BASE,op.path))===JSON.stringify(op.v)) stale.push(k); });
  stale.forEach(function(k){ PEND.delete(k); });
  savePend();
  if(PEND.size>0){ dot("dirty"); scheduleSave(); } else dot("ok");
}
loadUI(); loadPend();
BASE=readEmbedded()||{players:[],rounds:[]}; ensureShape(BASE);
ST=clone(BASE); applyPend();
render();

fetch("data/state.json",{cache:"no-store"}).then(function(res){ return res.ok?res.json():null; })
 .then(function(j){
   if(j && num(j.rev)>num(BASE.rev)){ ensureShape(j); BASE=j; ST=clone(BASE); applyPend(); render(); }
 }).catch(function(){}).then(function(){ reconcile(); });

if(window.claude && window.claude.use){
  window.claude.use("artifact").then(function(cap){
    CAP=cap;
    if(!cap){ NOCAP=true; render(); return; }
    if(PEND.size>0) scheduleSave();
  }).catch(function(){ NOCAP=true; render(); });
}else{ NOCAP=true; }

window.addEventListener("beforeunload",function(){ savePend(); saveUI(); });
})();
</script>
</body>
</html>
